[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fly-video-neural"
version = "0.1.0"
description = "Leakage-safe video-to-neural benchmarking for Drosophila behavior"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
fly-video-neural = "fly_video_neural.cli:main"
fly-video-neural-qc = "fly_video_neural.data_qc:main"
fly-video-neural-null = "fly_video_neural.alignment_null:main"
fly-video-neural-unlock = "fly_video_neural.validation_gate:main"
fly-video-neural-prepare = "fly_video_neural.prepare_v1:main"
fly-video-neural-develop = "fly_video_neural.development_protocol:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_video_neural"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

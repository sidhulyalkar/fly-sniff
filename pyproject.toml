[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fly-sniff"
version = "0.1.0"
description = "Connectome-constrained Drosophila odor-source navigation benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  # Science-v1 deliberately stays on the NumPy 1.26 ABI. This avoids mixed
  # system-site SciPy wheels compiled against NumPy 1.x being imported under
  # NumPy 2.x on macOS, and gives the sealed benchmark a reproducible ABI lane.
  "numpy>=1.26,<2",
  "scipy>=1.12,<2",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
malecns = ["neuprint-python>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fly-sniff-demo = "fly_sniff.cli:demo_main"
fly-sniff-demo-pack = "fly_sniff.demo_pack:main"
fly-sniff-benchmark = "fly_sniff.cli:benchmark_main"
fly-sniff-choice = "fly_sniff.choice:main"
fly-sniff-party = "fly_sniff.party_social:main"
fly-sniff-showcase = "fly_sniff.showcase:main"
fly-sniff-record = "fly_sniff.recording:main"
fly-sniff-replay-showcase = "fly_sniff.recorded_showcase:main"
fly-sniff-replay-showcase-v2 = "fly_sniff.recorded_showcase_v2:main"
fly-sniff-replay-showcase-v3 = "fly_sniff.recorded_showcase_v3:main"
fly-sniff-doctor = "fly_sniff.doctor:main"
fly-sniff-party-final = "fly_sniff.final_party:main"
fly-sniff-extract-malecns = "fly_sniff.malecns:main"
fly-sniff-download-annotations = "fly_sniff.public_data:download_annotations_main"
fly-sniff-download-weights = "fly_sniff.bulk_data:download_weights_main"
fly-sniff-offline-discover = "fly_sniff.public_data:offline_discover_main"
fly-sniff-explorer-discover = "fly_sniff.explorer_data:main"
fly-sniff-trace = "fly_sniff.trace:main"
fly-sniff-audit-trace = "fly_sniff.trace_audit:main"
fly-sniff-enrich-trace = "fly_sniff.trace_enrichment:main"
fly-sniff-science-handoff = "fly_sniff.science_handoff:main"
fly-sniff-literature-route-audit = "fly_sniff.literature_route_audit:main"
fly-sniff-audit-integration-route = "fly_sniff.integration_route_audit:main"
fly-sniff-audit-integration-sign = "fly_sniff.integration_sign_audit:main"
fly-sniff-audit-integration-sign-v2 = "fly_sniff.integration_sign_audit_v2:main"
fly-sniff-audit-integration-topography = "fly_sniff.integration_topography_audit:main"
fly-sniff-probe-goal-channel = "fly_sniff.goal_channel_probe:main"
fly-sniff-build-steering-scaffold = "fly_sniff.steering_scaffold:main"
fly-sniff-probe-steering = "fly_sniff.steering_probe:main"
fly-sniff-qualify = "fly_sniff.qualification:main"
fly-sniff-freeze = "fly_sniff.freeze:main"
fly-sniff-final = "fly_sniff.qualified_eval:main"
fly-sniff-render-final = "fly_sniff.final_social:main"
fly-sniff-evidence-validate = "fly_sniff.evidence.ledger:main"
fly-sniff-evidence-bootstrap = "fly_sniff.evidence.bootstrap:main"
fly-sniff-experiment-protocol = "fly_sniff.experiment_protocol:main"
fly-sniff-connectome-necessity = "fly_sniff.connectome_necessity:main"
fly-sniff-physiology-calibration = "fly_sniff.physiology_calibration:main"
fly-sniff-physiology-bind = "fly_sniff.physiology_probe_binding:main"
fly-sniff-physiology-seal = "fly_sniff.physiology_calibrated_model:main"
fly-sniff-null-factory-v2 = "fly_sniff.null_factory_v2:main"
fly-sniff-null-generate = "fly_sniff.null_generation:main"
fly-sniff-final-seeds = "fly_sniff.final_seed_commitment:main"
fly-sniff-zero-shot = "fly_sniff.zero_shot_experiment:main"
fly-sniff-science-readiness = "fly_sniff.science_readiness:main"
fly-sniff-topology-stats = "fly_sniff.topology_statistics:main"
fly-sniff-topology-power = "fly_sniff.topology_power:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_sniff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/fly_sniff/goal_channel_probe.py" = ["I001", "PIE810"]

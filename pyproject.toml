[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fly-sniff"
version = "0.1.0"
description = "Connectome-constrained Drosophila odor-source navigation benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "h5py>=3.11",
]

[project.optional-dependencies]
malecns = ["neuprint-python>=0.5"]
dev = ["pytest>=8", "ruff==0.16.7"]

[project.scripts]
fly-sniff-demo = "fly_sniff.cli:demo_main"
fly-sniff-demo-pack = "fly_sniff.demo_pack:main"
fly-sniff-benchmark = "fly_sniff.cli:benchmark_main"
fly-sniff-choice = "fly_sniff.choice:main"
fly-sniff-party = "fly_sniff.party_social:main"
fly-sniff-showcase = "fly_sniff.showcase:main"
fly-sniff-record = "fly_sniff.recording:main"
fly-sniff-odor-motion = "fly_sniff.odor_motion:main"
fly-sniff-odor-events = "fly_sniff.odor_event_cli:main"
fly-sniff-odor-sensitivity = "fly_sniff.odor_sensitivity:main"
fly-sniff-qualify-odor-motion = "fly_sniff.odor_motion_qualification:main"
fly-sniff-experimental-plume-contract = "fly_sniff.experimental_plume:main"
fly-sniff-inspect-experimental-plume = "fly_sniff.experimental_plume_archive:main"
fly-sniff-reproduce-plume-cues = "fly_sniff.experimental_plume_reproduction:main"
fly-sniff-plot-odor-motion = "fly_sniff.odor_motion_visual:main"
fly-sniff-replay-odor-motion = "fly_sniff.odor_motion_showcase:main"
fly-sniff-replay-showcase = "fly_sniff.recorded_showcase:main"
fly-sniff-export-neural-scene = "fly_sniff.neural_scene:main"
fly-sniff-cinematic = "fly_sniff.cinematic_showcase:main"
fly-sniff-doctor = "fly_sniff.doctor:main"
fly-sniff-party-final = "fly_sniff.final_party:main"
fly-sniff-extract-malecns = "fly_sniff.malecns:main"
fly-sniff-download-annotations = "fly_sniff.public_data:download_annotations_main"
fly-sniff-download-weights = "fly_sniff.bulk_data:download_weights_main"
fly-sniff-offline-discover = "fly_sniff.public_data:offline_discover_main"
fly-sniff-explorer-discover = "fly_sniff.explorer_data:main"
fly-sniff-trace = "fly_sniff.trace:main"
fly-sniff-audit-trace = "fly_sniff.trace_audit:main"
fly-sniff-staged-trace = "fly_sniff.staged_trace:main"
fly-sniff-review-route = "fly_sniff.route_review:main"
fly-sniff-e001-evidence = "fly_sniff.e001_evidence:main"
fly-sniff-sign-authority = "fly_sniff.sign_authority:main"
fly-sniff-seed-plan = "fly_sniff.seed_plan:main"
fly-sniff-seal-candidate = "fly_sniff.candidate_seal:seal_main"
fly-sniff-verify-candidate = "fly_sniff.candidate_seal:verify_main"
fly-sniff-qualify = "fly_sniff.qualification:main"
fly-sniff-train-dynamics = "fly_sniff.reproducible_training:main"
fly-sniff-qualify-trained = "fly_sniff.trained_qualification:main"
fly-sniff-sealed-train = "fly_sniff.sealed_experiment:train_main"
fly-sniff-sealed-qualify = "fly_sniff.sealed_experiment:qualify_main"
fly-sniff-sealed-freeze-final = "fly_sniff.sealed_experiment:freeze_final_main"
fly-sniff-sealed-final = "fly_sniff.sealed_experiment:final_main"
fly-sniff-redteam-training = "fly_sniff.training_redteam:main"
fly-sniff-redteam-rewires = "fly_sniff.rewire_redteam:main"
fly-sniff-redteam-budget = "fly_sniff.training_budget_redteam:main"
fly-sniff-redteam-cem-replay = "fly_sniff.optimizer_replay:main"
fly-sniff-freeze-trained-final = "fly_sniff.trained_final:freeze_main"
fly-sniff-trained-final = "fly_sniff.trained_final:main"
fly-sniff-freeze = "fly_sniff.freeze:main"
fly-sniff-final = "fly_sniff.qualified_eval:main"
fly-sniff-render-final = "fly_sniff.final_social:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_sniff"]

[tool.hatch.build.targets.wheel.force-include]
"configs/odor_motion_v2.json" = "fly_sniff/configs/odor_motion_v2.json"
"configs/experimental_plume_v3.json" = "fly_sniff/configs/experimental_plume_v3.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# These checks intentionally use domain-contract exceptions: malformed report schema is
# a ValueError and a missing runtime budget receipt is a RuntimeError, not Python API typing.
"src/fly_sniff/trained_qualification.py" = ["TRY004"]
"src/fly_sniff/training.py" = ["TRY004"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fly-sniff"
version = "0.1.0"
description = "Connectome-constrained Drosophila odor-source navigation benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
malecns = ["neuprint-python>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fly-sniff-demo = "fly_sniff.cli:demo_main"
fly-sniff-benchmark = "fly_sniff.cli:benchmark_main"
fly-sniff-extract-malecns = "fly_sniff.malecns:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_sniff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

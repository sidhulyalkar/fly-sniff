[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fly-sniff"
version = "0.1.0"
description = "Connectome-constrained Drosophila odor-source navigation benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
malecns = ["neuprint-python>=0.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fly-sniff-demo = "fly_sniff.cli:demo_main"
fly-sniff-demo-pack = "fly_sniff.demo_pack:main"
fly-sniff-benchmark = "fly_sniff.cli:benchmark_main"
fly-sniff-choice = "fly_sniff.choice:main"
fly-sniff-party = "fly_sniff.party_social:main"
fly-sniff-party-final = "fly_sniff.final_party:main"
fly-sniff-extract-malecns = "fly_sniff.malecns:main"
fly-sniff-download-annotations = "fly_sniff.public_data:download_annotations_main"
fly-sniff-offline-discover = "fly_sniff.public_data:offline_discover_main"
fly-sniff-explorer-discover = "fly_sniff.explorer_data:main"
fly-sniff-trace = "fly_sniff.trace:main"
fly-sniff-qualify = "fly_sniff.qualification:main"
fly-sniff-freeze = "fly_sniff.freeze:main"
fly-sniff-final = "fly_sniff.qualified_eval:main"
fly-sniff-render-final = "fly_sniff.final_social:main"
fly-sniff-showcase = "fly_sniff.showcase:main"
fly-sniff-replay = "fly_sniff.replay:main"
fly-sniff-loom = "fly_sniff.looming:main"
fly-sniff-r002-authority = "fly_sniff.r002_authority:main"
fly-sniff-r002-graph = "fly_sniff.r002_graph:main"
fly-sniff-r002-probe = "fly_sniff.r002_probe:main"
fly-sniff-r002-qualify = "fly_sniff.r002_qualify:main"
fly-sniff-r002-render = "fly_sniff.r002_render:main"
fly-sniff-artifact-validate = "fly_sniff.kernel_cli:main"
fly-sniff-final-entropy = "fly_sniff.final_protocol:main"
fly-sniff-topology-null = "fly_sniff.topology_nulls:main"
fly-sniff-topology-inference = "fly_sniff.topology_inference:main"
fly-sniff-calibration-validate = "fly_sniff.physiology_calibration:main"
fly-sniff-program-a = "fly_sniff.program_a_preflight:main"
fly-sniff-source-fetch = "fly_sniff.physiology_source_fetch:main"
fly-sniff-dna02-readme-fetch = "fly_sniff.dna02_dataset_readme:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_sniff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

name: olfactory-motion-audit

on:
  pull_request:
    paths:
      - "configs/olfactory_motion_audit_v1.json"
      - "configs/olfactory_motion_connectivity_v1.json"
      - "src/fly_sniff/olfactory_motion_audit.py"
      - "src/fly_sniff/olfactory_motion_connectivity.py"
      - "tests/test_olfactory_motion_audit.py"
      - "tests/test_olfactory_motion_connectivity.py"
      - "tests/test_odor_v2_isolation.py"
      - "pyproject.toml"
      - ".github/workflows/olfactory-motion-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip wheel . --wheel-dir /tmp/fly-sniff-wheel
          python -m pip install /tmp/fly-sniff-wheel/*.whl
      - name: Create synthetic MaleCNS-like fixture
        working-directory: /tmp
        run: |
          python - <<'PY'
          import pandas as pd
          ann = pd.DataFrame([
              {"bodyId": 1, "type": "il3LN6", "instance": "il3LN6_L", "class": "ALLN", "subclass": None, "somaSide": "L", "rootSide": None},
              {"bodyId": 2, "type": "il3LN6", "instance": "il3LN6_R", "class": "ALLN", "subclass": None, "somaSide": "R", "rootSide": None},
              {"bodyId": 10, "type": "DA1_lPN", "instance": "DA1_lPN_L", "class": "ALPN", "subclass": None, "somaSide": "L", "rootSide": None},
              {"bodyId": 11, "type": "DA1_lPN", "instance": "DA1_lPN_R", "class": "ALPN", "subclass": None, "somaSide": "R", "rootSide": None},
              {"bodyId": 20, "type": "ORN_DA1", "instance": "ORN_DA1_L", "class": "olfactory", "subclass": None, "somaSide": None, "rootSide": "L"},
              {"bodyId": 21, "type": "ORN_DA1", "instance": "ORN_DA1_R", "class": "olfactory", "subclass": None, "somaSide": None, "rootSide": "R"},
          ])
          edges = pd.DataFrame([
              {"body_pre": 20, "body_post": 10, "weight": 3},
              {"body_pre": 21, "body_post": 11, "weight": 4},
              {"body_pre": 20, "body_post": 2, "weight": 5},
              {"body_pre": 21, "body_post": 1, "weight": 7},
              {"body_pre": 1, "body_post": 10, "weight": 9},
              {"body_pre": 2, "body_post": 11, "weight": 11},
          ])
          ann.to_feather("annotations.feather")
          edges.to_feather("weights.feather")
          PY
      - name: Run installed annotation-only Gate A
        working-directory: /tmp
        run: |
          fly-sniff-audit-olfactory-motion \
            --annotations annotations.feather \
            --output gate-a.json
      - name: Freeze synthetic Gate A into temporary Gate B contract
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json
          from fly_sniff.olfactory_motion_connectivity import load_connectivity_config
          gate = json.load(open("gate-a.json"))
          config = load_connectivity_config()
          config["gate_a"]["report_sha256"] = gate["report_sha256"]
          config["gate_a"]["annotation_sha256"] = gate["annotation_sha256"]
          config["gate_a"]["selected_body_count"] = gate["selected_body_count"]
          config["gate_a"]["candidate_counts"] = gate["candidate_counts"]
          json.dump(config, open("gate-b-config.json", "w"))
          PY
      - name: Run installed Gate B connectivity audit
        working-directory: /tmp
        run: |
          fly-sniff-audit-olfactory-connectivity \
            --gate-a gate-a.json \
            --annotations annotations.feather \
            --weights weights.feather \
            --config gate-b-config.json \
            --output gate-b.json \
            --edges-output selected-edges.parquet
          python - <<'PY'
          import json
          report = json.load(open("gate-b.json"))
          assert report["status"] == "candidate_structural_motif_present"
          assert report["all_required_structural_paths_present"] is True
          assert report["selected_body_count"] == 6
          assert report["selected_edge_count"] == 6
          assert report["neurotransmitter_sign_inferred"] is False
          assert report["delay_inferred"] is False
          assert report["functional_motion_claim_allowed"] is False
          assert report["navigation_claim_allowed"] is False
          PY

name: video-neural-research

on:
  pull_request:
    paths:
      - "research/video_neural/**"
      - ".github/workflows/video-neural.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/video_neural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated research package
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen dataset registry
        run: fly-video-neural validate-registry configs/datasets_v1.json
      - name: Validate historical v0 benchmark contract
        run: fly-video-neural validate-benchmark configs/benchmark_v0.json
      - name: Validate corrected v1 benchmark contract
        run: fly-video-neural validate-benchmark configs/benchmark_v1.json
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q

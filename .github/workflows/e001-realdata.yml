name: e001-realdata

on:
  workflow_dispatch:

jobs:
  structural-route:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install built wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/fly-sniff-wheel
          python -m pip install /tmp/fly-sniff-wheel/*.whl

      - name: Restore MaleCNS v1.0 flat-connectome cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: malecns-v1.0-flat-minconf-0.5-v1

      - name: Download exact public MaleCNS inputs
        run: |
          fly-sniff-download-annotations \
            --output data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
          fly-sniff-download-weights \
            --output data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather \
            --yes-large-download

      - name: Seal input checksums
        run: |
          mkdir -p results/e001-realdata
          sha256sum \
            data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather \
            configs/staged_route_v1.json \
            configs/role_review_v1.json \
            authority/olfactory-navigation-literature-v1.json \
            > results/e001-realdata/input-sha256.txt
          git rev-parse HEAD > results/e001-realdata/git-sha.txt

      - name: Run preregistered E001 structural route
        id: e001
        shell: bash
        run: |
          set +e
          fly-sniff-staged-trace \
            data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather \
            --config configs/staged_route_v1.json \
            --output data/cache/staged-route-v1 \
            --strict \
            > results/e001-realdata/staged-trace.stdout.json \
            2> results/e001-realdata/staged-trace.stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > results/e001-realdata/exit-code.txt

      - name: Derive exact body-ID role review
        if: steps.e001.outputs.exit_code == '0'
        run: |
          fly-sniff-review-route \
            data/cache/staged-route-v1 \
            --policy configs/role_review_v1.json \
            --output data/cache/role-review-v1 \
            > results/e001-realdata/role-review.stdout.json \
            2> results/e001-realdata/role-review.stderr.log

      - name: Build claim-boundary evidence pack
        if: steps.e001.outputs.exit_code == '0'
        run: |
          fly-sniff-e001-evidence \
            data/cache/staged-route-v1 \
            data/cache/role-review-v1 \
            --policy configs/role_review_v1.json \
            --authority authority/olfactory-navigation-literature-v1.json \
            --output results/e001-realdata/evidence-pack \
            > results/e001-realdata/evidence-pack.stdout.json \
            2> results/e001-realdata/evidence-pack.stderr.log

      - name: Write scientific summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("data/cache/staged-route-v1/staged_trace_report.json")
          evidence_path = Path("results/e001-realdata/evidence-pack/e001_evidence.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          exit_path = Path("results/e001-realdata/exit-code.txt")
          exit_code = exit_path.read_text().strip() if exit_path.exists() else "not produced"
          lines = ["# MaleCNS E001 exact-body-ID evidence lane", ""]
          lines.append(f"Structural CLI exit code: `{exit_code}`")
          lines.append("")
          if report_path.exists():
              report = json.loads(report_path.read_text())
              lines.extend([
                  f"Primary structural hypothesis: **{'PASS' if report.get('primary_structural_hypothesis_passed') else 'FAIL'}**",
                  f"Required stage audits: `{report.get('required_stage_audit_pass_count')}/{report.get('required_stage_count')}`",
                  f"Required handoffs: `{report.get('required_handoff_pass_count')}/{report.get('required_handoff_count')}`",
                  "",
                  "| stage | status | structural audit |",
                  "|---|---|---|",
              ])
              for stage in report.get("stages", []):
                  lines.append(
                      f"| {stage.get('name')} | {stage.get('status')} | {stage.get('structural_audit_passed')} |"
                  )
              lines.extend(["", "## Exact body-ID handoffs", ""])
              for handoff in report.get("handoffs", []):
                  lines.append(
                      f"- **{handoff.get('name')}**: {'PASS' if handoff.get('passed') else 'FAIL'}; "
                      f"shared IDs = `{handoff.get('shared_body_ids', [])}`"
                  )
          else:
              lines.extend([
                  "No staged trace report was produced. This is an engineering/execution failure, not a biological negative result.",
                  "Inspect the uploaded stderr/stdout artifacts before interpreting the run.",
              ])

          if evidence_path.exists():
              pack = json.loads(evidence_path.read_text())
              gate = pack["ship_gate"]
              lines.extend([
                  "",
                  "## Claim gate",
                  "",
                  f"Claim level: **{pack['claim_level']}**",
                  f"Structural evidence pack ready: **{gate['structural_evidence_pack_ready']}**",
                  f"Training promotion ready: **{gate['training_promotion_ready']}**",
                  f"Public functional result ready: **{gate['public_functional_result_ready']}**",
                  "",
                  "> " + gate["max_public_wording"],
              ])

          lines.extend([
              "",
              "> E001 is structural evidence only. A PASS does not establish physiological dynamics, odor tuning, synaptic sign, navigation performance, or superiority to rewired controls.",
          ])
          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              Path(summary_path).write_text(text)
          Path("results/e001-realdata/summary.md").write_text(text)
          PY

      - name: Upload E001 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e001-malecns-v1.0-exact-body-id-evidence
          path: |
            results/e001-realdata
            data/cache/staged-route-v1
            data/cache/role-review-v1
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce preregistered structural gate
        if: always()
        shell: bash
        run: |
          code="${{ steps.e001.outputs.exit_code }}"
          if [[ -z "$code" ]]; then
            echo "E001 did not produce an exit code; execution failed before the scientific gate."
            exit 1
          fi
          if [[ "$code" != "0" ]]; then
            echo "E001 primary structural hypothesis did not pass the preregistered gate (exit $code)."
            echo "This is preserved as an auditable negative result; do not tune the frozen plan in place."
            exit "$code"
          fi

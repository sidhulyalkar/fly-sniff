name: source-evidence-fetch

on:
  pull_request:
    paths:
      - "src/fly_sniff/physiology_source_fetch.py"
      - "authority/program-a-dna02-source-contract-v1.json"
      - ".github/workflows/source-evidence-fetch.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch bounded public source evidence
        shell: bash
        run: |
          mkdir -p results/source-ingress/pfn-readme-v1
          mkdir -p results/source-ingress/dna02-dataverse-v1

          set +e
          fly-sniff-source-fetch pfn-readme \
            --out results/source-ingress/pfn-readme-v1 \
            > results/source-ingress/pfn-readme-v1/stdout.txt \
            2> results/source-ingress/pfn-readme-v1/stderr.txt
          echo "$?" > results/source-ingress/pfn-readme-v1/exit-code.txt

          fly-sniff-source-fetch dna02-metadata \
            --contract authority/program-a-dna02-source-contract-v1.json \
            --out results/source-ingress/dna02-dataverse-v1 \
            > results/source-ingress/dna02-dataverse-v1/stdout.txt \
            2> results/source-ingress/dna02-dataverse-v1/stderr.txt
          echo "$?" > results/source-ingress/dna02-dataverse-v1/exit-code.txt

          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: physiology-source-evidence-${{ github.sha }}
          path: results/source-ingress
          if-no-files-found: error
          retention-days: 30

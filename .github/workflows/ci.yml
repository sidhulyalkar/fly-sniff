name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: fly-sniff-source-fetch --help
      - run: fly-sniff-dna02-readme-fetch --help
      - run: fly-sniff-dna02-cohort-validate --help
      - run: fly-sniff-dna02-cohort-validate authority/program-a-dna02-cohort-adjudication-v1.json
      - run: fly-sniff-pfn-readme-fetch --help
      - run: fly-sniff-dna02-download --help
      - run: fly-sniff-dna02-inspect --help
      - run: fly-sniff-dna02-field-map --help
      - run: fly-sniff-dna02-field-map > /tmp/dna02-field-map-authority.json
      - run: fly-sniff-dna02-prominence-audit --help
      - run: fly-sniff-dna02-threshold-adjudicate --help
      - run: fly-sniff-dna02-threshold-waveform-review --help
      - run: fly-sniff-dna02-threshold-distribution-review --help
      - run: fly-sniff-dna02-threshold-freeze --help
      - run: fly-sniff-dna02-threshold-freeze-v2 --help
      - run: ruff check src tests
      - run: pytest -q

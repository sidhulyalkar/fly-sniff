name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install built wheel and test dependencies
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/fly-sniff-wheel
          python -m pip install /tmp/fly-sniff-wheel/*.whl 'pytest>=8' 'ruff==0.16.7'
      - name: Smoke installed commands outside checkout
        working-directory: /tmp
        run: |
          fly-sniff-record --help
          fly-sniff-odor-motion --help
          fly-sniff-odor-events --help
          fly-sniff-plot-odor-motion --help
          fly-sniff-record --output /tmp/odor-motion-recording.json --sim-seconds 0.50 --plume-points 8
          fly-sniff-odor-motion /tmp/odor-motion-recording.json --output /tmp/odor-motion-analysis.json
          fly-sniff-odor-events /tmp/odor-motion-recording.json /tmp/odor-motion-analysis.json --output /tmp/odor-events.json
          fly-sniff-plot-odor-motion /tmp/odor-motion-recording.json /tmp/odor-motion-analysis.json --output /tmp/odor-motion.png
          test -s /tmp/odor-motion-analysis.json
          test -s /tmp/odor-events.json
          test -s /tmp/odor-motion.png
          fly-sniff-staged-trace --help
          fly-sniff-review-route --help
          fly-sniff-e001-evidence --help
          fly-sniff-sign-authority --help
          fly-sniff-seed-plan --help
          fly-sniff-seal-candidate --help
          fly-sniff-verify-candidate --help
          fly-sniff-cinematic --help
          fly-sniff-train-dynamics --help
          fly-sniff-qualify-trained --help
          fly-sniff-sealed-train --help
          fly-sniff-sealed-qualify --help
          fly-sniff-sealed-freeze-final --help
          fly-sniff-sealed-final --help
          fly-sniff-redteam-training --help
          fly-sniff-redteam-rewires --help
          fly-sniff-redteam-budget --help
          fly-sniff-redteam-cem-replay --help
          fly-sniff-freeze-trained-final --help
          fly-sniff-trained-final --help
      - name: Check sealed Mac shell syntax
        run: |
          bash -n scripts/bootstrap_macos_sealed_experiment.sh
          bash -n scripts/run_sealed_experiment_mac.sh
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check src tests --output-format json > ruff-report.json
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json
          if-no-files-found: error
          retention-days: 2
      - name: Enforce Ruff
        if: steps.ruff.outcome == 'failure'
        run: |
          cat ruff-report.json
          exit 1
      - run: pytest -q

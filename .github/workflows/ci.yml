name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check src tests --output-format json > ruff-report.json
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json
          if-no-files-found: error
          retention-days: 2
      - name: Enforce Ruff
        if: steps.ruff.outcome == 'failure'
        run: |
          cat ruff-report.json
          exit 1
      - run: pytest -q

  connectome-twin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/connectome-twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/connectome-twin/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

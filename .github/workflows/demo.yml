name: demo-pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/showcase-today
      - feat/recorded-sensory-replay-v1
    paths:
      - "src/fly_sniff/**"
      - "configs/odor_motion_v2.json"
      - "pyproject.toml"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "src/fly_sniff/**"
      - "configs/odor_motion_v2.json"
      - "pyproject.toml"
      - ".github/workflows/demo.yml"

jobs:
  render-development-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build auditable demo pack
        run: >-
          fly-sniff-demo-pack --output-dir artifacts/demo --seconds 6
          --fps 10 --trials 100 --format gif
      - name: Record authoritative social episode
        run: >-
          fly-sniff-record --output artifacts/showcase/who-farted-run.json
          --seed 13013 --sim-seconds 45 --plume-points 600
      - name: Derive bilateral odor timing
        run: >-
          fly-sniff-odor-motion artifacts/showcase/who-farted-run.json
          --output artifacts/showcase/odor-motion-v2.json
      - name: Derive odor event diagnostics
        run: >-
          fly-sniff-odor-events artifacts/showcase/who-farted-run.json
          artifacts/showcase/odor-motion-v2.json
          --output artifacts/showcase/odor-events-v2.json
      - name: Run frozen threshold sensitivity audit
        run: >-
          fly-sniff-odor-sensitivity artifacts/showcase/who-farted-run.json
          artifacts/showcase/odor-motion-v2.json
          artifacts/showcase/odor-events-v2.json
          --output artifacts/showcase/odor-sensitivity-v2.json
      - name: Build scientific odor timing diagnostic
        run: >-
          fly-sniff-plot-odor-motion artifacts/showcase/who-farted-run.json
          artifacts/showcase/odor-motion-v2.json
          --events artifacts/showcase/odor-events-v2.json
          --output artifacts/showcase/odor-motion-v2.png
      - name: Build temporal HUD preview
        run: >-
          fly-sniff-replay-odor-motion artifacts/showcase/who-farted-run.json
          artifacts/showcase/odor-motion-v2.json
          artifacts/showcase/odor-events-v2.json
          --output artifacts/showcase/who-farted-odor-motion.gif --seconds 6 --fps 10
      - name: Build recorded 4:5 preview
        run: >-
          fly-sniff-cinematic artifacts/showcase/who-farted-run.json
          --output artifacts/showcase/who-farted-4x5.gif --seconds 6 --fps 10
      - name: Build recorded share-ready 4:5 MP4
        run: >-
          fly-sniff-cinematic artifacts/showcase/who-farted-run.json
          --output artifacts/showcase/who-farted-4x5.mp4 --seconds 15 --fps 30
      - name: Show manifest
        run: cat artifacts/demo/demo-manifest.json
      - name: Upload demo pack
        uses: actions/upload-artifact@v4
        with:
          name: who-farted-development-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 14
      - name: Upload social showcase
        uses: actions/upload-artifact@v4
        with:
          name: who-farted-4x5-showcase
          path: artifacts/showcase/
          if-no-files-found: error
          retention-days: 14

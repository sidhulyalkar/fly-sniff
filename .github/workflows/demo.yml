name: demo-pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/showcase-today
    paths:
      - "src/fly_sniff/**"
      - "pyproject.toml"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "src/fly_sniff/**"
      - "pyproject.toml"
      - ".github/workflows/demo.yml"

jobs:
  render-development-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build auditable demo pack
        run: fly-sniff-demo-pack --output-dir artifacts/demo --seconds 6 --fps 10 --trials 100 --format gif
      - name: Build fast 4:5 preview
        run: fly-sniff-showcase --output artifacts/showcase/who-farted-4x5.gif --seconds 6 --fps 10
      - name: Build share-ready 4:5 MP4
        run: fly-sniff-showcase --output artifacts/showcase/who-farted-4x5.mp4 --seconds 15 --fps 30
      - name: Show manifest
        run: cat artifacts/demo/demo-manifest.json
      - name: Upload demo pack
        uses: actions/upload-artifact@v4
        with:
          name: who-farted-development-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 14
      - name: Upload social showcase
        uses: actions/upload-artifact@v4
        with:
          name: who-farted-4x5-showcase
          path: artifacts/showcase/
          if-no-files-found: error
          retention-days: 14

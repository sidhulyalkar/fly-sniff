name: experimental-plume-v3

on:
  pull_request:
    paths:
      - "configs/experimental_plume_v3.json"
      - "src/fly_sniff/experimental_plume*.py"
      - "tests/test_experimental_plume*.py"
      - "pyproject.toml"
      - ".github/workflows/experimental-plume-v3.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip wheel . --wheel-dir /tmp/fly-sniff-wheel
          python -m pip install /tmp/fly-sniff-wheel/*.whl
      - name: Validate packaged provenance contract
        working-directory: /tmp
        run: |
          fly-sniff-experimental-plume-contract --plume smooth --write-template smooth.json
          fly-sniff-experimental-plume-contract --plume complex --write-template complex.json
          if fly-sniff-experimental-plume-contract --manifest smooth.json; then exit 1; fi
          if fly-sniff-experimental-plume-contract --manifest complex.json; then exit 1; fi
      - name: Exercise archive and cue CLIs outside checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json, h5py, numpy as np
          from fly_sniff.experimental_plume import load_experimental_plume_config
          cfg = load_experimental_plume_config()
          cfg["complex"]["dataset"] = "/scratch/frames"
          cfg["complex"]["expected_shape"] = [5, 3, 2]
          cfg["complex"]["intensity_scale"] = 1.0
          json.dump(cfg, open("tiny-config.json", "w"))
          with h5py.File("tiny.nwb", "w") as f:
              g = f.create_group("scratch")
              g.create_dataset("frames", data=np.arange(30, dtype=np.float32).reshape(5, 3, 2))
              g.create_dataset("timestamps", data=np.arange(5, dtype=np.float64) / 60.0)
          PY
          fly-sniff-inspect-experimental-plume --config tiny-config.json --plume complex --source-file tiny.nwb --output archive.json
          fly-sniff-reproduce-plume-cues --config tiny-config.json --plume complex --source-file tiny.nwb --output cues.npz --receipt cues.json
          python - <<'PY'
          import json
          archive = json.load(open("archive.json"))
          cues = json.load(open("cues.json"))
          assert archive["status"] == "archive_qualified"
          assert archive["native_time_basis"]["kind"] == "explicit_timestamps"
          assert cues["status"] == "computed_pending_reference_comparison"
          assert cues["gradient_samples"] == 5 and cues["motion_samples"] == 3
          assert cues["controller_access"] is False and cues["navigation_performance_used"] is False
          PY
